# JanusGraph cell2（M10 迁移演练第二 Cell）的 ConfigurationManagementGraph 存储配置。
# 与 janusgraph-server.properties 唯一差异：后端指向 cell2 自己的 Cassandra + ES
# （compose 服务名 cassandra-cell-2 / es-graph-2）——Cell 间存储物理独立。
# ids.authority.wait-time 保持 JanusGraph 默认值，禁止调大（红线 4）。
gremlin.graph=org.janusgraph.core.JanusGraphFactory
storage.backend=cql
storage.hostname=cassandra-cell-2
storage.cql.keyspace=janusgraph_config
index.search.backend=elasticsearch
index.search.hostname=es-graph-2
index.search.elasticsearch.health-refresh-interval=5s
cache.db-cache=false
# 容器重建（compose up 配置变更触发 recreate）时，旧实例注册在 Cassandra 里仍带
# 新鲜心跳，新进程会被 "same instance id already open" 拒绝启动——允许替换同名实例。
graph.replace-instance-if-exists=true

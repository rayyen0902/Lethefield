name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run CI
        run: bash scripts/ci.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

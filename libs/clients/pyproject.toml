[project]
name = "lethefield-clients"
version = "0.1.0"
description = "存储与 Pulsar 客户端封装 + ControlPlaneStore 抽象（M0 冻结接口）"
requires-python = ">=3.12"
dependencies = [
    "cassandra-driver>=3.29",
    "elasticsearch>=8.13,<9",
    "pulsar-client>=3.4",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_clients"]

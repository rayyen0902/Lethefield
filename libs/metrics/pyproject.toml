[project]
name = "lethefield-metrics"
version = "0.1.0"
description = "指标 registry 封装（命名规则与标签白/黑名单在代码层强制，见开发文档 M12）"
requires-python = ">=3.12"
dependencies = ["prometheus-client>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_metrics"]

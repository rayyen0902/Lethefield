[project]
name = "lethefield-is"
version = "0.1.0"
description = "IS 简版（M16：账号 CRUD / 空间创建入口 / JWT 签发与吊销 / debug 闸门 / 授权注册表入口）"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-logschema",
    "lethefield-scheduler",
    "pyjwt>=2.8",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-scheduler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_is"]

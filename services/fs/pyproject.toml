[project]
name = "lethefield-fs"
version = "0.1.0"
description = "FS sweep worker：忽视惩罚 / n_star 顺带刷新 / 归档 / 固化（M6）"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-metrics",
    "lethefield-rms",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-metrics = { workspace = true }
lethefield-rms = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_fs"]

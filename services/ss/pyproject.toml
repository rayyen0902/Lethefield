[project]
name = "lethefield-ss"
version = "0.1.0"
description = "SS 显著性打分服务（M14：EX 事件流 → LLM 六维打分 → scoring-results + EX 回写）"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-rms",
    "lethefield-logschema",
    "lethefield-metrics",
    "pulsar-client>=3.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-rms = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_ss"]

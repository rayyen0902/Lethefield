[project]
name = "lethefield-writer"
version = "0.1.0"
description = "写入链 worker（M15：scoring-results consumer → RMS 图顶点 + 时序边 + 向量）"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-rms",
    "lethefield-logschema",
    "lethefield-metrics",
    "pulsar-client>=3.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-rms = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_writer"]

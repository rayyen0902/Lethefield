[project]
name = "lethefield-scheduler"
version = "0.1.0"
description = "租户调度器（M9 Cell 架构）：space→Cell 映射 / 开通 / 注销 / 水位制调度"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-rms",
    "cassandra-driver>=3.29",
    "gremlinpython>=3.7",
    "elasticsearch>=8.13",
    "requests>=2.31",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-rms = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_scheduler"]

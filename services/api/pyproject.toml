[project]
name = "lethefield-api"
version = "0.1.0"
description = "MCP / SDK 接口层（M5：四操作、JWT 鉴权、debug scope 裁剪、EX 摄入最小路径）"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-rms",
    "lethefield-metrics",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "mcp>=1.2,<2",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-rms = { workspace = true }
lethefield-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_api"]

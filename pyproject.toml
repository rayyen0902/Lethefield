[project]
name = "lethefield"
version = "0.1.0"
description = "Lethefield — FF 驱动的记忆状态场（1.0 开发 monorepo 根，虚拟包）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "lethefield-api",
    "lethefield-auth-registry",
    "lethefield-clients",
    "lethefield-clock-monitor",
    "lethefield-decision-log",
    "lethefield-fs",
    "lethefield-ingest-dms",
    "lethefield-logschema",
    "lethefield-metrics",
    "lethefield-rms",
    "lethefield-scheduler",
    "lethefield-training",
    "gremlinpython>=3.7",
    "requests>=2.31",
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "ops/*", "services/*"]

[tool.uv.sources]
lethefield-api = { workspace = true }
lethefield-auth-registry = { workspace = true }
lethefield-clients = { workspace = true }
lethefield-clock-monitor = { workspace = true }
lethefield-decision-log = { workspace = true }
lethefield-fs = { workspace = true }
lethefield-ingest-dms = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-metrics = { workspace = true }
lethefield-rms = { workspace = true }
lethefield-scheduler = { workspace = true }
lethefield-training = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs", "ops", "services"]

[tool.ruff]
target-version = "py312"
line-length = 100
# spike/ 是历史验证脚本（M0 起存档，非维护代码），不进 lint/format 范围
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project]
name = "lethefield-auth-registry"
version = "0.1.0"
description = "训练数据授权注册表最小实现（§12.4，M0 建空表）"
requires-python = ">=3.12"
dependencies = ["lethefield-clients", "psycopg[binary]>=3.1"]

[tool.uv.sources]
lethefield-clients = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_auth_registry"]

[project]
name = "lethefield-ingest-dms"
version = "0.1.0"
description = "EX 摄入 Dead Man's Switch（M10）：管道活性探针 + 训练控制 backlog 监控 + space 写入新鲜度"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-logschema",
    "lethefield-metrics",
    "pulsar-client>=3.4",
    "redis>=5.0",
    "requests>=2.31",
    "cassandra-driver>=3.29",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_ingest_dms"]

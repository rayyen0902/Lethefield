[project]
name = "lethefield-ops-cli"
version = "0.1.0"
description = "运维操作面 CLI（M17）：人工触发点统一收口，强制 space/cell 绑定 + 自动决策留痕"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-decision-log",
    "lethefield-logschema",
    "lethefield-rms",
    "lethefield-scheduler",
    "lethefield-training",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-decision-log = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-rms = { workspace = true }
lethefield-scheduler = { workspace = true }
lethefield-training = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_ops_cli"]

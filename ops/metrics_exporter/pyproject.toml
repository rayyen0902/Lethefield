[project]
name = "lethefield-metrics-exporter"
version = "0.1.0"
description = "离线聚合指标 worker（M12）：标定线/留痕线 gauge+counter 从日志管线与元数据聚合"
requires-python = ">=3.12"
dependencies = [
    "lethefield-clients",
    "lethefield-logschema",
    "lethefield-metrics",
    "elasticsearch>=8.13,<9",
    "cassandra-driver>=3.29",
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
lethefield-clients = { workspace = true }
lethefield-logschema = { workspace = true }
lethefield-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethefield_metrics_exporter"]

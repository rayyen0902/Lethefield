# Lethefield 单节点全栈（M0 工程地基）
# 组件对齐开发文档 §1 技术栈与规划文档 §3：spike 的 Cassandra/ES/JanusGraph + Pulsar、Redis、PostgreSQL。
# 物理隔离口径：cell 用与 EX 用的 Cassandra 是两个独立容器实例；
# 图索引/向量用 ES 与运维日志用 ES 是两个独立容器实例（容器级隔离对应集群级隔离的最小形态）。

services:
  cassandra-cell:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-cell
      CASSANDRA_CLUSTER_NAME: lethefield-cell
    ports:
      - "9042:9042"
    volumes:
      - cassandra-cell-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-ex:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-ex
      CASSANDRA_CLUSTER_NAME: lethefield-ex
    ports:
      - "9043:9042"
    volumes:
      - cassandra-ex-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------- M10 ex2 profile
  # 准出档迁移演练用第二 EX 集群（定案：按需起，默认不进 CI——
  # `docker compose --profile ex2 up -d`）。独立集群名 + 独立卷，与 cassandra-ex
  # 物理隔离；sstableloader 经容器网络 cassandra-ex → cassandra-ex-2:7000 流式传输。
  cassandra-ex-2:
    image: cassandra:4.1
    profiles: ["ex2"]
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-ex-2
      CASSANDRA_CLUSTER_NAME: lethefield-ex-2
    ports:
      - "9143:9042"
    volumes:
      - cassandra-ex-2-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  es-graph:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      cluster.name: lethefield-graph
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # 修订记录第 25 条配套：rms_vectors 快照备份的 fs 仓库路径（runbook 见
      # 运维-runbook-ES快照备份恢复-v0_1.md）
      path.repo: /usr/share/elasticsearch/snapshots
    ports:
      - "9200:9200"
    volumes:
      - es-graph-data:/usr/share/elasticsearch/data
      - es-graph-snapshots:/usr/share/elasticsearch/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  es-ops:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      cluster.name: lethefield-ops
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - es-ops-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  janusgraph:
    image: janusgraph/janusgraph:1.0.0
    environment:
      JAVA_OPTIONS: -Xms512m -Xmx1g
    depends_on:
      cassandra-cell:
        condition: service_healthy
      es-graph:
        condition: service_healthy
    ports:
      - "8182:8182"
    volumes:
      # 自定义 gremlin-server：启用 JanusGraphManager + ConfigurationManagementGraph，
      # 支持 ConfiguredGraphFactory 动态建图（每图独立 keyspace，spike Q3 路径）。
      # 注意：镜像 entrypoint 读取的固定路径是 /etc/opt/janusgraph/janusgraph-server.yaml。
      - ./deploy/janusgraph/gremlin-server.yaml:/etc/opt/janusgraph/janusgraph-server.yaml:ro
      - ./deploy/janusgraph/janusgraph-server.properties:/opt/janusgraph/conf/gremlin-server/janusgraph-server.properties:ro

  # ---------------------------------------------------------------- M10 cell2 profile
  # 迁移演练用第二 Cell（定案：按需起，默认不进 CI——`docker compose --profile cell2 up -d`）。
  # heap 合计 ~1.3G 是上限，勿调大（colima VM 10GiB 已踩过 OOM，见 AGENTS.md/工作日志）。
  cassandra-cell-2:
    image: cassandra:4.1
    profiles: ["cell2"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-cell-2
      CASSANDRA_CLUSTER_NAME: lethefield-cell-2
    ports:
      - "9142:9042"
    volumes:
      - cassandra-cell-2-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  es-graph-2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: ["cell2"]
    environment:
      cluster.name: lethefield-graph-2
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "9300:9200"
    volumes:
      - es-graph-2-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  janusgraph-2:
    image: janusgraph/janusgraph:1.0.0
    profiles: ["cell2"]
    environment:
      JAVA_OPTIONS: -Xms256m -Xmx512m
    depends_on:
      cassandra-cell-2:
        condition: service_healthy
      es-graph-2:
        condition: service_healthy
    ports:
      - "8183:8182"
    volumes:
      # gremlin-server.yaml 与主 Cell 共用（无存储主机名）；ConfigurationManagementGraph
      # 的存储配置走 cell2 变体 properties（指向 cassandra-cell-2 / es-graph-2）。
      - ./deploy/janusgraph/gremlin-server.yaml:/etc/opt/janusgraph/janusgraph-server.yaml:ro
      - ./deploy/janusgraph/janusgraph-server-cell2.properties:/opt/janusgraph/conf/gremlin-server/janusgraph-server.properties:ro

  pulsar:
    image: apachepulsar/pulsar:3.3.2
    command: bin/pulsar standalone
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m"
    ports:
      - "6650:6650"
      - "8080:8080"
    volumes:
      - pulsar-data:/pulsar/data

  redis:
    image: redis:7
    # M13 红线 3 定案：AOF（appendonly + everysec）是 n 权威值（ex:n:{space}）的
    # 配套硬要求——纯 RDB 丢窗会让 n 回退（序号重复分配风险，DMS n 一致性巡检兜底）。
    # 不配 maxmemory-policy：逐出可能误伤权威键 ex:n（豁免键清单见红线汇总核验记录）。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lethefield
      POSTGRES_PASSWORD: lethefield
      POSTGRES_DB: lethefield
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lethefield -d lethefield"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------- M12 可观测性（开发期最小集）
  # 被监控对象（API / FS / training worker / ingest-dms / metrics-exporter）不在 compose 里，
  # 是宿主机 uv run 进程，scrape 目标走 host.docker.internal（见 deploy/prometheus/prometheus.yml）。
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lethefield-prometheus-1
    restart: unless-stopped
    ports:
      - "9090:9090"
    # Linux（CI runner）默认不解析 host.docker.internal——显式映射宿主机网关；
    # colima/Docker Desktop 原生支持，此行是无害重复
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lethefield-grafana-1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      # 开发期默认口令，勿用于生产。
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  cassandra-cell-data:
  cassandra-cell-2-data:
  cassandra-ex-data:
  cassandra-ex-2-data:
  es-graph-data:
  es-graph-snapshots:
  es-graph-2-data:
  es-ops-data:
  pulsar-data:
  postgres-data:
  prometheus-data:
  grafana-data:
